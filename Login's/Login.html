<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Wiki Media - Pagina de Login</title>
</head>

<body>
    <div class="modal modal-sheet position-static d-block p-4 py-md-5" tabindex="-1" role="dialog" id="modalSignin">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header p-5 pb-4 border-bottom-0">
                    <h1 class="fw-bold  fs-2 text-center">Login</h1>
                </div>
                <div class="modal-body p-5 pt-0">
                    <form class="">
                        <div class="form-floating mb-3"> <input type="email" class="form-control rounded-3"  placeholder="name@example.com" id="UsuarioCampo"> <label for="floatingInput">Usuario</label> </div>
                        <div class="form-floating mb-3"> <input type="password" class="form-control rounded-3" placeholder="Password" id="SenhaCampo"> <label for="floatingPassword">Senha</label> </div> 
                        <button class="w-100 mb-2 btn btn-lg rounded-3 btn-primary" type="submit" id="LogarBotao">Login</button>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/Scripts/Login/RealizarLogin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
